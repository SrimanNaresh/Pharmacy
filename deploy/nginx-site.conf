# Ayush Pharmacy - nginx reverse-proxy site
# Exact-match server_name wins over the *.thangaminfotech.com wildcard used by
# other apps, so this is safe to add without disturbing them.
#
# Install path: /etc/nginx/sites-available/ayushpharma.conf
#   symlink ->   /etc/nginx/sites-enabled/ayushpharma.conf

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ayushpharma.thangaminfotech.com;

    ssl_certificate     /etc/letsencrypt/live/thangaminfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thangaminfotech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:5120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ayushpharma.thangaminfotech.com;
    return 301 https://$host$request_uri;
}
